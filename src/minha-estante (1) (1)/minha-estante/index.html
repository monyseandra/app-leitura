<!doctype html>
<!-- MINHA ESTANTE – página principal.
     O visual está em css/style.css e todo o código (React) está em js/app.js. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Faz o site se ajustar ao tamanho da tela do celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minha Estante</title>

  <!-- Fontes do Google: Cormorant Garamond (títulos), Nunito (textos) e Atkinson Hyperlegible (opção para dislexia) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

  <!-- Todo o visual do site -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- O React desenha o app dentro desta caixa -->
  <div id="root"></div>

  <!-- Bibliotecas (precisam de internet): React, ReactDOM e htm -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>

  <!-- Código do app (telas, dados, acessibilidade). Deve vir depois das bibliotecas -->
  <script src="js/app.js"></script>
</body>
</html>
